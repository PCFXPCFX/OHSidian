# Builds the OHSidian HAP in CI and publishes it as a GitHub Release.
#
# How it works
#   - The build needs the official HarmonyOS command-line-tools (they bundle
#     hvigor, ohpm and the HarmonyOS SDK). Huawei rotates the download URL
#     every release, so the URL is resolved in this order:
#       1. workflow_dispatch input `cli_tools_url`
#       2. repository variable  vars.HARMONYOS_CLI_URL   (Settings > Variables)
#       3. the fallback default below (update it when Huawei ships a new build)
#     Get the current "Command Line Tools" linux-x64 zip URL from
#     https://developer.huawei.com/consumer/cn/download/ and put it into the
#     repository variable for reproducible builds.
#   - obsidian.asar is NOT stored in the repository. Every build downloads
#     the official obsidian-<version>.asar.gz pinned by the app package.json,
#     verifies its SHA-256 hash and RSA-SHA256 signature against the pinned
#     distribution cert (scripts/cert-obsidian.pem), injects the OHSidian
#     runtime patches and repacks it (scripts/update-obsidian.mjs), then
#     scripts/verify-asar.cjs asserts syntax and all patch markers. The
#     download is cached per version (actions/cache).
#   - build-profile.json5 is gitignored (it holds local signing credentials);
#     CI generates it from build-profile.example.json5 and strips the
#     placeholder signing config, producing an UNSIGNED HAP.
#   - Optional signing: if the secrets listed in docs/RELEASE.md are set, the
#     workflow writes them to .ci-sign/ and injects a real signingConfig, so
#     the released HAP is installable out of the box. Without the secrets the
#     unsigned HAP is published and users sign it themselves (see docs).
#
# Outputs (build matrix): one .hap per launcher icon (ohsidian / obsidian),
# named OHSidian-v<version>-<icon>-icon-<signed|unsigned>.hap, each with
# SHA256SUMS.txt + MD5SUMS.txt plus a preview PNG of its launcher icon
# (docs/images/icon-<icon>.png). A follow-up "release" job merges both
# builds, renders release notes whose download table shows each HAP's icon
# inline, and attaches everything to a GitHub Release on a v* tag push.

name: build-release

on:
  workflow_dispatch:
    inputs:
      cli_tools_url:
        description: 'HarmonyOS command-line-tools linux-x64 zip URL (optional override)'
        required: false
        default: ''
      compatible_sdk:
        description: 'compatibleSdkVersion (default = device-validated combo)'
        required: false
        default: '6.1.1(24)'
      target_sdk:
        description: 'targetSdkVersion'
        required: false
        default: '6.1.1(24)'
      build_mode:
        description: 'buildMode: release or debug (debug = closer to a local DevEco build)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

# Fallback only - prefer vars.HARMONYOS_CLI_URL in repository settings.
env:
  CLI_URL_FALLBACK: 'https://developer.huawei.com/consumer/cn/download/'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        # One build per launcher icon; both HAPs attach to the same Release.
        icon: [ohsidian, obsidian]
    steps:
      - name: Checkout (with LFS for native libs)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Read pinned Obsidian version
        id: obsidian
        run: echo "version=$(node -p "require('./web_engine/src/main/resources/resfile/resources/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache official Obsidian asar download
        uses: actions/cache@v4
        with:
          path: scripts/.tmp-update
          # S-N10: the cert hash is part of the key - a rotated/changed
          # pinned cert must not reuse a cached download verified by the
          # OLD cert.
          key: obsidian-asar-${{ steps.obsidian.outputs.version }}-${{ hashFiles('scripts/cert-obsidian.pem') }}

      # S-N11: fail loudly if the pinned cert was ever swapped in a PR.
      # Rotation is a deliberate, documented act: update CERT_SHA256 below
      # in the same commit as the new scripts/cert-obsidian.pem.
      - name: Verify pinned cert hash
        env:
          CERT_SHA256: 'f38d398e140113c116da69753eace2824774b5524b76e8aad09513fd3c583b8a'
        run: echo "$CERT_SHA256  scripts/cert-obsidian.pem" | sha256sum -c -

      - name: Install scripts dependencies
        run: npm ci --prefix scripts

      # Version is pinned to the app package.json (upgrade via PR), NOT to
      # upstream "latest". --repatch is REQUIRED here: the plain path would
      # exit "already up to date" without producing an asar, because the
      # asar itself is no longer committed to the repository.
      - name: Fetch, verify and patch obsidian.asar (official source)
        run: node scripts/update-obsidian.mjs "${{ steps.obsidian.outputs.version }}" --repatch

      - name: Verify patched asar (syntax + patch markers)
        run: node scripts/verify-asar.cjs

      - name: Resolve command-line-tools URL
        id: cli
        run: |
          URL="${{ inputs.cli_tools_url || vars.HARMONYOS_CLI_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::No HARMONYOS_CLI_URL configured - the fallback is a download PAGE, not a zip. Set the repository variable for CI to work."
            URL="${{ env.CLI_URL_FALLBACK }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install HarmonyOS command-line-tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ctl"
          # Huawei direct links carry a signed query string
          # (?HW-CC-KV=...&HW-CC-Sign=...) - the download must use the FULL
          # URL, while the archive type is detected from the PATH part.
          URL_FULL="${{ steps.cli.outputs.url }}"
          URL_PATH="${URL_FULL%%\?*}"
          case "$URL_PATH" in
            *.tar.gz|*.tgz)
              ARCHIVE="$RUNNER_TEMP/ctl.tar.gz"
              curl -fL --retry 3 -o "$ARCHIVE" "$URL_FULL"
              tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/ctl"
              ;;
            *.zip)
              ARCHIVE="$RUNNER_TEMP/ctl.zip"
              curl -fL --retry 3 -o "$ARCHIVE" "$URL_FULL"
              unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/ctl"
              ;;
            *)
              echo "::error::Cannot detect archive type from HARMONYOS_CLI_URL path: $URL_PATH (expected .tar.gz or .zip)"
              exit 1
              ;;
          esac
          # S-N12: the CLI tools execute arbitrary build code, and the URL
          # is plain HTTPS (a compromised CDN/DNS is enough). Pin the
          # archive's sha256 once in the repository variable
          # HARMONYOS_CLI_SHA256 (Settings > Variables); CI then fails on
          # any mismatch. Unset = warned, not enforced.
          CLI_SHA256="${{ vars.HARMONYOS_CLI_SHA256 }}"
          if [ -n "$CLI_SHA256" ]; then
            echo "$CLI_SHA256  $ARCHIVE" | sha256sum -c -
          else
            echo "::warning::HARMONYOS_CLI_SHA256 is not set - the command-line-tools download is UNVERIFIED (DNS/CDN hijack would run arbitrary code in CI). Compute 'sha256sum' of the archive once and set the repository variable to enforce it."
          fi
          # Anchor on the SDK itself: hvigor validates DEVECO_SDK_HOME
          # against the real SDK directory, so locate it directly instead
          # of guessing from the hvigorw path (layout differs per version).
          echo "--- package layout (first 40 entries):"
          find "$RUNNER_TEMP/ctl" -maxdepth 2 | head -40
          SDK_DIR="$(find "$RUNNER_TEMP/ctl" -maxdepth 3 -type d -name sdk -not -empty | head -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "::error::No non-empty 'sdk' directory in the extracted tools. Full layout:"
            find "$RUNNER_TEMP/ctl" -maxdepth 3 | head -80
            exit 1
          fi
          CTL_ROOT="$(dirname "$SDK_DIR")"
          echo "CTL_ROOT=$CTL_ROOT"
          echo "SDK contents:"; ls "$SDK_DIR"
          echo "DEVECO_SDK_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          HVIGORW_PATH="$CTL_ROOT/bin/hvigorw"
          if [ ! -e "$HVIGORW_PATH" ]; then
            HVIGORW_PATH="$(find "$CTL_ROOT" -maxdepth 3 \( -type f -o -type l \) -name hvigorw | head -1)"
          fi
          if [ -z "$HVIGORW_PATH" ] || [ ! -e "$HVIGORW_PATH" ]; then
            echo "::error::hvigorw not found under $CTL_ROOT"
            exit 1
          fi
          chmod +x "$HVIGORW_PATH" 2>/dev/null || true
          echo "hvigorw at: $HVIGORW_PATH"
          echo "$CTL_ROOT/bin" >> "$GITHUB_PATH"
          OHPM_PATH="$(find "$CTL_ROOT" -maxdepth 4 \( -type f -o -type l \) -name ohpm | head -1)"
          if [ -n "$OHPM_PATH" ]; then
            echo "ohpm at: $OHPM_PATH"
            chmod +x "$OHPM_PATH" 2>/dev/null || true
            echo "$(dirname "$OHPM_PATH")" >> "$GITHUB_PATH"
          else
            echo "::warning::ohpm binary not found under $CTL_ROOT - the ohpm install step will fail"
          fi

      - name: Select launcher icon
        run: |
          set -euxo pipefail
          # HarmonyOS cannot switch the launcher icon at runtime; the icon is
          # baked from AppScope/resources/base/media at build time. The icon
          # variant comes from the build matrix.
          ICON="${{ matrix.icon }}"
          case "$ICON" in
            ohsidian|ohsidian-gem|obsidian) ;;
            *) echo "::error::Unknown app_icon variant: $ICON"; exit 1 ;;
          esac
          SRC="icons/${ICON}.png"
          if [ ! -f "$SRC" ]; then
            echo "::warning::Icon variant '$ICON' missing at $SRC - keeping the ohsidian default"
            ICON="ohsidian"
            SRC="icons/${ICON}.png"
          fi
          # The launcher icon (app.json5) and the startup-window icon
          # (module.json5 startWindowIcon) both resolve to AppScope media.
          cp "$SRC" AppScope/resources/base/media/app_icon.png
          cp "$SRC" AppScope/resources/base/media/startIcon.png
          echo "launcher icon: $ICON"

      - name: Generate build-profile.json5 (unsigned, target API 24)
        run: |
          export COMPATIBLE_SDK="${{ inputs.compatible_sdk || '6.1.1(24)' }}"
          export TARGET_SDK="${{ inputs.target_sdk || '6.1.1(24)' }}"
          node scripts/ci/gen-build-profile.js

      - name: Optional signing setup (only if secrets are configured)
        env:
          SIGN_STORE_P12: ${{ secrets.SIGN_STORE_P12 }}         # base64 .p12
          SIGN_CERT_CER: ${{ secrets.SIGN_CERT_CER }}           # base64 .cer
          SIGN_PROFILE_P7B: ${{ secrets.SIGN_PROFILE_P7B }}     # base64 .p7b
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_STORE_P12" ] || [ -z "$SIGN_CERT_CER" ] || [ -z "$SIGN_PROFILE_P7B" ]; then
            echo "Signing secrets not set - building an UNSIGNED HAP (users sign it themselves, see docs/RELEASE.md)."
            exit 0
          fi
          mkdir -p .ci-sign
          echo "$SIGN_STORE_P12" | base64 -d > .ci-sign/keystore.p12
          echo "$SIGN_CERT_CER" | base64 -d > .ci-sign/app-release.cer
          echo "$SIGN_PROFILE_P7B" | base64 -d > .ci-sign/profile-release.p7b
          SIGNING_JSON="$(node -e '
            const name = "ci";
            console.log(JSON.stringify({
              name,
              type: "HarmonyOS",
              material: {
                certpath: ".ci-sign/app-release.cer",
                keyAlias: process.env.SIGN_KEY_ALIAS,
                keyPassword: process.env.SIGN_KEY_PASSWORD,
                profile: ".ci-sign/profile-release.p7b",
                signAlg: "SHA256withECDSA",
                storeFile: ".ci-sign/keystore.p12",
                storePassword: process.env.SIGN_STORE_PASSWORD,
              },
            }));
          ')"
          export SIGNING_JSON
          node scripts/ci/gen-build-profile.js

      - name: Install ohpm dependencies
        run: |
          ohpm install --all

      - name: Resolve release version (tag wins, app.json5 fallback)
        run: |
          set -euxo pipefail
          # The TAG is authoritative for a release build: v1.2.3 produces
          # v1.2.3 artifacts even if app.json5 was forgotten. workflow_
          # dispatch builds (no tag) fall back to the app.json5 value.
          # versionCode follows the repo convention major*1e6+minor*1e4+patch
          # (1.2.1 -> 1020001) so upgrades keep ordering.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE:-branch}" != "tag" ] || [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ]; then
            TAG_VERSION=""
          fi
          FILE_VERSION="$(sed -nE 's/.*"versionName"\s*:\s*"([^"]+)".*/\1/p' AppScope/app.json5 | head -1)"
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
          elif [ -n "$FILE_VERSION" ]; then
            VERSION="$FILE_VERSION"
          else
            echo "::error::No tag version and no versionName in AppScope/app.json5"
            exit 1
          fi
          # Inject the release version into app.json5 so the HAP's own
          # versionName/versionCode match the tag. Values are passed as
          # EXPANDED shell arguments (single-quoted heredoc-style script
          # cannot see unexported shell vars - the earlier attempt wrote
          # the literal string "undefined" into versionCode and hvigor
          # failed with "JSON5: invalid character 'u'").
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          PATCH="$(echo "$VERSION" | cut -d. -f3)"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH))
          node -e '
            const fs = require("fs");
            const [code, version] = process.argv.slice(1);
            const p = "AppScope/app.json5";
            const s = fs.readFileSync(p, "utf8");
            const out = s
              .replace(/"versionCode"\s*:\s*\d+/, "\"versionCode\": " + code)
              .replace(/"versionName"\s*:\s*"[^"]+"/, "\"versionName\": \"" + version + "\"");
            fs.writeFileSync(p, out);
          ' "$VERSION_CODE" "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release version: $VERSION (code $VERSION_CODE; tag='${GITHUB_REF_NAME:-none}', file='$FILE_VERSION')"

      - name: Build HAP
        run: |
          hvigorw --mode module -p product=default -p buildMode=${{ inputs.build_mode || 'release' }} assembleHap --no-daemon

      - name: Collect HAP artifacts
        run: |
          set -euxo pipefail
          VERSION="$(sed -nE 's/.*"versionName"\s*:\s*"([^"]+)".*/\1/p' AppScope/app.json5 | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from AppScope/app.json5"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          find . -path ./oh_modules -prune -o -name '*.hap' -print
          # Rename hvigor's <module>-<product>-<mode>[-unsigned].hap to
          # OHSidian-v<version>-<icon>-icon-<signed|unsigned>.hap (e.g.
          # OHSidian-v1.2.0-obsidian-icon-signed.hap) so the icon variant is
          # readable straight from the file name and both matrix builds can
          # attach to the same Release without name clashes.
          find . -path ./oh_modules -prune -o -name '*.hap' -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *unsigned*) suffix="unsigned" ;;
              *signed*)   suffix="signed" ;;
              *)          suffix="build" ;;
            esac
            cp "$f" "dist/OHSidian-v${VERSION}-${{ matrix.icon }}-icon-${suffix}.hap"
          done
          # Ship a small preview PNG of this build's launcher icon so the
          # Release download table can show what each HAP's icon looks like.
          if [ -f "docs/images/icon-${{ matrix.icon }}.png" ]; then
            cp "docs/images/icon-${{ matrix.icon }}.png" "dist/icon-${{ matrix.icon }}.png"
          else
            echo "::warning::Icon preview missing: docs/images/icon-${{ matrix.icon }}.png"
          fi
          cd dist
          sha256sum *.hap > SHA256SUMS.txt
          md5sum *.hap > MD5SUMS.txt
          ls -la

      - name: Upload workflow artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: ohsidian-v${{ env.APP_VERSION }}-${{ matrix.icon }}-icon-hap
          path: |
            dist/*.hap
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
            dist/icon-*.png

  # Merges the matrix builds' artifacts into ONE GitHub Release (a single
  # release job avoids two jobs racing on the same tag).
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - name: Checkout (release notes template + app version)
        uses: actions/checkout@v5

      - name: Download built HAPs
        uses: actions/download-artifact@v4
        with:
          pattern: ohsidian-v*-icon-hap
          merge-multiple: true
          path: dist

      - name: Merge checksums and render release notes
        run: |
          set -euxo pipefail
          cd dist
          rm -f SHA256SUMS.txt MD5SUMS.txt
          sha256sum *.hap > SHA256SUMS.txt
          md5sum *.hap > MD5SUMS.txt
          VERSION="${GITHUB_REF_NAME#v}"
          # Fallback: tag without a parseable semver body -> app.json5.
          case "$VERSION" in
            *[!0-9.]*|"") VERSION="$(sed -nE 's/.*"versionName"\s*:\s*"([^"]+)".*/\1/p' ../AppScope/app.json5 | head -1)" ;;
          esac
          # Release body: rendered from scripts/ci/release-notes-template.md
          # (edit THAT file to change the wording). The script has cd'd into
          # dist/, so repo-root paths anchor on GITHUB_WORKSPACE.
          TEMPLATE="$GITHUB_WORKSPACE/scripts/ci/release-notes-template.md"
          if [ ! -f "$TEMPLATE" ]; then
            echo "::error::Release notes template missing: $TEMPLATE"
            exit 1
          fi
          HAP_TABLE="$RUNNER_TEMP/hap-table.md"
          {
            echo "| 桌面图标 | 文件 | 说明 |"
            echo "| --- | --- | --- |"
            IMG_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/images"
            for f in *.hap; do
              case "$f" in
                *-obsidian-icon-*)     icon="obsidian";     desc="Obsidian 官方图标版" ;;
                *-ohsidian-gem-icon-*) icon="ohsidian-gem"; desc="OHsidian 宝石图标版" ;;
                *-ohsidian-icon-*)     icon="ohsidian";     desc="OHsidian 图标版(本移植版专属)" ;;
                *)                     icon="";             desc="HarmonyOS HAP 安装包" ;;
              esac
              if [ -n "$icon" ] && [ -f "icon-${icon}.png" ]; then
                cell="<img src=\"${IMG_BASE}/icon-${icon}.png\" width=\"48\" alt=\"${icon}\">"
              else
                cell="—"
              fi
              echo "| $cell | \`$f\` | $desc |"
            done
          } > "$HAP_TABLE"
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "/{{HAP_TABLE}}/r $HAP_TABLE" \
              -e "/{{SHA256}}/r SHA256SUMS.txt" \
              -e "/{{MD5}}/r MD5SUMS.txt" \
              "$TEMPLATE" \
            | sed -e '/{{HAP_TABLE}}/d' -e '/{{SHA256}}/d' -e '/{{MD5}}/d' \
            > RELEASE_NOTES.md
          rm -f "$HAP_TABLE"
          cat RELEASE_NOTES.md
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.hap
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
            dist/icon-*.png
